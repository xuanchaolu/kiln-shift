<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烧制色盘 · 人工标注</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232f6bff'/%3E%3Ccircle cx='8' cy='8' r='3.4' fill='%23fff'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --line:#e2e6eb; --line2:#eef1f5;
    --ink:#171b21; --ink2:#5a6572; --ink3:#8b95a3;
    --accent:#2f6bff; --accent-soft:#eaf0ff;
    --ok:#0d9b6c; --warn:#c9720a; --danger:#d64545;
    --r:10px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  html,body{height:100%;margin:0}
  body{
    font:14px/1.55 var(--font); color:var(--ink); background:var(--bg);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  /* ---------- 顶栏 ---------- */
  header{
    height:54px; display:flex; align-items:center; gap:14px; padding:0 16px;
    background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:5;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.2px}
  .brand .dot{
    width:16px;height:16px;border-radius:5px;
    background:conic-gradient(from 210deg,#e7c9c4,#a8bdd4,#8fb9a0,#e8d79a,#d9a2a8,#e7c9c4);
    box-shadow:inset 0 0 0 2px #fff, 0 0 0 1px var(--line);
  }
  .brand small{font-weight:450;color:var(--ink3);font-size:12px;margin-left:2px}
  .tabs{display:flex;gap:4px;margin-left:6px;background:#f1f3f6;padding:3px;border-radius:9px}
  .tab{
    display:flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:7px;
    padding:5px 11px;color:var(--ink2);font-size:13px;transition:.15s;
  }
  .tab:hover{color:var(--ink);background:#e9edf2}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,50,.1);font-weight:600}
  .tab .prog{font-family:var(--mono);font-size:11px;color:var(--ink3);padding:1px 5px;border-radius:5px;background:#f1f3f6}
  .tab.on .prog{background:var(--accent-soft);color:var(--accent)}
  .tab .prog.full{background:#e5f7ef;color:var(--ok)}
  .spacer{flex:1}
  .savestate{font-size:12px;color:var(--ink3);font-family:var(--mono);display:flex;align-items:center;gap:5px}
  .savestate i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
  .btn{
    border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 11px;
    font-size:13px; color:var(--ink2); transition:.15s; white-space:nowrap;
  }
  .btn:hover{border-color:#cfd6de;color:var(--ink);background:#fafbfc}
  .btn:active{transform:translateY(.5px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#245ae0;border-color:#245ae0}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:#f1f3f6}
  .btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- 主体 ---------- */
  main{display:flex;height:calc(100% - 54px);min-height:0}
  #stage{position:relative;flex:1;min-width:0;background:#eceff3;overflow:hidden}
  #stage.empty{display:flex;align-items:center;justify-content:center;color:var(--ink3)}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
  .hint{
    position:absolute;left:14px;bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
    font-size:12px;color:var(--ink2);pointer-events:none;
    background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:9px;
    padding:5px 9px;backdrop-filter:blur(6px);box-shadow:0 1px 4px rgba(20,30,50,.06);
  }
  .hint kbd{
    font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.9);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink2);
  }
  .zoom{
    position:absolute;right:14px;bottom:12px;display:flex;align-items:center;gap:2px;
    background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:9px;
    padding:3px;box-shadow:0 2px 8px rgba(20,30,50,.07);backdrop-filter:blur(6px);
  }
  .zoom button{border:0;background:transparent;height:26px;min-width:26px;padding:0 4px;border-radius:6px;font-size:15px;color:var(--ink2);display:grid;place-items:center;white-space:nowrap}
  .zoom button:hover{background:#f1f3f6;color:var(--ink)}
  .zoom .lv{font-family:var(--mono);font-size:11px;color:var(--ink2);min-width:42px;text-align:center}

  /* ---------- 侧栏 ---------- */
  #panel{
    width:392px;flex:0 0 392px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .p-head{padding:14px 16px 12px;border-bottom:1px solid var(--line2)}
  .p-head .row{display:flex;align-items:center;gap:8px}
  .p-title{font-weight:650;font-size:15px;letter-spacing:.2px}
  .p-sub{font-size:12px;color:var(--ink3);margin-top:3px}
  .p-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
  .sec{padding:14px 16px;border-bottom:1px solid var(--line2)}
  .sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .sec-h b{font-size:12.5px;letter-spacing:.4px;color:var(--ink2);font-weight:600}
  .sec-h .aside{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}

  /* 当前颜色卡 */
  .curcard{background:#fbfcfe;border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .curcard .top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .badge{
    font-family:var(--mono);font-size:12px;font-weight:600;background:var(--accent);color:#fff;
    padding:3px 9px;border-radius:6px;letter-spacing:.3px;
  }
  .chip{
    width:22px;height:22px;border-radius:6px;display:inline-block;flex:0 0 auto;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);
    background-color:#fff;
  }
  .chip.big{width:34px;height:34px;border-radius:8px}
  .chip.empty{
    background-image:linear-gradient(45deg,#e9edf1 25%,transparent 25%,transparent 75%,#e9edf1 75%),linear-gradient(45deg,#e9edf1 25%,transparent 25%,transparent 75%,#e9edf1 75%);
    background-size:8px 8px;background-position:0 0,4px 4px;
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .slots{display:flex;flex-direction:column;gap:8px}
  .slot{
    border:1px dashed #cfd7e0;border-radius:9px;padding:9px 10px;background:#fff;
    transition:.15s;position:relative;
  }
  .slot.filled{border-style:solid;border-color:var(--line)}
  .slot.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .slot .l1{display:flex;align-items:center;gap:8px}
  .slot .idx{
    width:18px;height:18px;border-radius:50%;background:#f0f3f7;color:var(--ink2);
    font-size:11px;display:grid;place-items:center;font-weight:600;flex:0 0 auto;
  }
  .slot.filled .idx{background:var(--accent-soft);color:var(--accent)}
  .slot .txt{font-size:12.5px;color:var(--ink2);flex:1;min-width:0}
  .slot .txt.empty{color:var(--ink3)}
  .slot .acts{display:flex;gap:2px;opacity:0;transition:.15s}
  .slot:hover .acts,.slot.active .acts{opacity:1}
  .slot .sub{display:flex;align-items:center;gap:6px;margin-top:5px}
  .slot .sub .mono{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .mean{
    margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .mean .lbl{font-size:11.5px;color:var(--ink3);line-height:1.3}
  .mean .val{font-family:var(--mono);font-size:12px;color:var(--ink)}
  .mean .hex{font-family:var(--mono);font-size:12px;color:var(--ink2);letter-spacing:.4px}
  .pair{
    margin-top:9px;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink3);
    padding:6px 8px;background:#f6f8fb;border-radius:7px;
  }
  .pair .mono{font-family:var(--mono);color:var(--ink2)}

  /* 颜色列表 */
  .list{display:flex;flex-direction:column;gap:3px}
  .item{
    display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;transition:.12s;
  }
  .item:hover{background:#f6f8fb}
  .item.on{background:var(--accent-soft);border-color:#c9d8ff}
  .item .num{font-family:var(--mono);font-size:11.5px;color:var(--ink3);width:20px;text-align:right;flex:0 0 auto}
  .item.on .num{color:var(--accent);font-weight:600}
  .item .chips{display:flex;gap:3px;flex:0 0 auto}
  .item .chips .chip{width:17px;height:17px;border-radius:4px}
  .item .state{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
  .item .dots{display:flex;gap:2px}
  .item .dots i{width:5px;height:5px;border-radius:50%;background:#dfe4ea;display:block}
  .item .dots i.f{background:var(--accent)}
  .item .del{opacity:0;border:0;background:transparent;color:var(--ink3);padding:2px 4px;border-radius:5px;font-size:13px;line-height:1}
  .item:hover .del{opacity:1}
  .item .del:hover{background:#fdecec;color:var(--danger)}
  .empty-note{font-size:12px;color:var(--ink3);padding:10px 2px}

  /* 页脚 */
  .p-foot{padding:10px 16px;border-top:1px solid var(--line2);display:flex;gap:6px;flex-wrap:wrap}
  .p-foot .btn{flex:1;justify-content:center;text-align:center}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:56px;transform:translate(-50%,14px);z-index:50;
    background:rgba(23,27,33,.93);color:#fff;padding:8px 15px;border-radius:9px;font-size:13px;
    opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 24px rgba(10,20,40,.2);
    max-width:70vw;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d7dde4;border-radius:6px;border:3px solid #fff}
  ::-webkit-scrollbar-thumb:hover{background:#c4ccd6}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>烧制色盘 · 标注<small id="brandSub"></small></div>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <div class="savestate" id="saveState"><i></i>未保存</div>
  <button class="btn" id="btnImport">导入</button>
  <button class="btn" id="btnCSV">导出 CSV</button>
  <button class="btn primary" id="btnJSON">导出 JSON</button>
  <button class="btn ghost" id="btnReset" title="清空全部标注">重置</button>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</header>

<main>
  <section id="stage">
    <canvas id="cv"></canvas>
    <div class="hint">
      <kbd>拖拽</kbd>框选
      <kbd>空格</kbd>平移
      <kbd>滚轮</kbd>缩放
      <kbd>⌘Z</kbd>撤销
      <kbd>⌫</kbd>删框
    </div>
    <div class="zoom">
      <button id="zOut" title="缩小">−</button>
      <span class="lv" id="zLv">100%</span>
      <button id="zIn" title="放大">+</button>
      <button id="zFit" title="适应窗口" style="font-size:12px">适应</button>
    </div>
  </section>

  <aside id="panel">
    <div class="p-head">
      <div class="row">
        <span class="p-title" id="pTitle">当前标注</span>
        <span class="spacer" style="flex:1"></span>
        <button class="btn sm" id="btnGoNext">继续自动标注</button>
      </div>
      <div class="p-sub" id="pSub"></div>
    </div>
    <div class="p-body">
      <div class="sec">
        <div class="sec-h"><b>当前颜色</b><span class="aside" id="curAside"></span></div>
        <div id="curCard"></div>
      </div>
      <div class="sec">
        <div class="sec-h">
          <b>颜色列表</b>
          <span class="aside"><span id="listMeta"></span></span>
        </div>
        <div class="list" id="list"></div>
        <div style="display:flex;gap:6px;margin-top:10px">
          <button class="btn sm" id="btnAddColor" style="flex:1">+ 新增颜色</button>
        </div>
      </div>
    </div>
    <div class="p-foot">
      <button class="btn sm" id="btnPrev">← 上一颜色</button>
      <button class="btn sm" id="btnNext">下一颜色 →</button>
    </div>
  </aside>
</main>

<div id="toast"></div>

/* ============================================================
   工具
   ============================================================ */
const $  = (s) => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const r1 = (v) => Math.round(v * 10) / 10;
const hex = (c) => '#' + c.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('').toUpperCase();
const rgbStr = (c) => `rgb(${Math.round(c[0])}, ${Math.round(c[1])}, ${Math.round(c[2])})`;
let uidN = 0;
const uid = () => 'c' + (++uidN) + '_' + Math.random().toString(36).slice(2, 6);

let toastTimer = 0;
function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms || 1900);
}

/* ============================================================
   状态
   ============================================================ */
function newColor() {
  return { id: uid(), images: [ { boxes: [] }, { boxes: [] } ] };
}
function blankState() {
  return {
    v: 1,
    colors: [ newColor() ],
    cur: { img: 0, color: 0 },
    autoAdvance: true,
    pinned: false,          // 用户手动选中某颜色 -> 暂停自动推进
    showOthers: true,
  };
}
let state = blankState();

/* 运行时（不持久化） */
const rt = {
  imgs: [],            // { el, w, h, ctx }
  view: [],            // { scale, tx, ty }
  drag: null,
  draft: null,
  hover: null,
  spaceDown: false,
  lastPointer: null,
  undo: [],
};

/* ============================================================
   存取
   ============================================================ */
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      $('#saveState').innerHTML = '<i></i>已自动保存 ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    } catch (e) {
      $('#saveState').innerHTML = '<i style="background:#d64545"></i>保存失败';
    }
  }, 260);
}

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.colors) || !s.colors.length) return false;
    s.colors.forEach(c => {
      if (!Array.isArray(c.images)) c.images = [ { boxes: [] }, { boxes: [] } ];
      c.images.forEach(im => { if (!Array.isArray(im.boxes)) im.boxes = []; });
      if (!c.id) c.id = uid();
    });
    if (!s.cur || typeof s.cur.img !== 'number') s.cur = { img: 0, color: 0 };
    s.cur.img = clamp(s.cur.img | 0, 0, 1);
    s.cur.color = clamp(s.cur.color | 0, 0, s.colors.length - 1);
    if (typeof s.autoAdvance !== 'boolean') s.autoAdvance = true;
    if (typeof s.pinned !== 'boolean') s.pinned = false;
    if (typeof s.showOthers !== 'boolean') s.showOthers = true;
    state = s;
    return true;
  } catch (e) { return false; }
}

function pushUndo() {
  rt.undo.push(JSON.stringify(state));
  if (rt.undo.length > 60) rt.undo.shift();
}
function undo() {
  if (!rt.undo.length) { toast('没有可撤销的操作'); return; }
  const s = rt.undo.pop();
  try { state = JSON.parse(s); } catch (e) { return; }
  renderAll(); save(); toast('已撤销');
}

/* ============================================================
   取色：在原图分辨率上统计均值
   ============================================================ */
function normRect(b, im) {
  let x = b.x, y = b.y, w = b.w, h = b.h;
  if (w < 0) { x += w; w = -w; }
  if (h < 0) { y += h; h = -h; }
  x = clamp(Math.round(x), 0, im.w);
  y = clamp(Math.round(y), 0, im.h);
  w = clamp(Math.round(w), 0, im.w - x);
  h = clamp(Math.round(h), 0, im.h - y);
  return { x, y, w, h };
}

function boxStats(imgIdx, box) {
  const im = rt.imgs[imgIdx];
  if (!im) return null;
  const rc = normRect(box, im);
  if (rc.w < 1 || rc.h < 1) return null;
  const d = im.ctx.getImageData(rc.x, rc.y, rc.w, rc.h).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
  }
  if (!n) return null;
  return { rgb: [r / n, g / n, b / n], px: n };
}

/** 重新计算某个框的坐标（取整）与均值 */
function recomputeBox(imgIdx, box) {
  const im = rt.imgs[imgIdx];
  const rc = normRect(box, im);
  box.x = rc.x; box.y = rc.y; box.w = rc.w; box.h = rc.h;
  const st = boxStats(imgIdx, box);
  if (st) { box.rgb = st.rgb.map(r1); box.px = st.px; }
  else { box.rgb = [0, 0, 0]; box.px = 0; }
  return box;
}

/** 该颜色在该图上的合并均值（两个框所有像素的加权平均） */
function colorMean(imgIdx, color) {
  const boxes = (color && color.images[imgIdx] && color.images[imgIdx].boxes) || [];
  if (!boxes.length) return null;
  let r = 0, g = 0, b = 0, n = 0;
  for (const bx of boxes) {
    if (!bx.rgb || !bx.px) continue;
    r += bx.rgb[0] * bx.px; g += bx.rgb[1] * bx.px; b += bx.rgb[2] * bx.px; n += bx.px;
  }
  if (!n) return null;
  return { rgb: [r / n, g / n, b / n], px: n };
}

/* ============================================================
   图片加载
   ============================================================ */
function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('图片加载失败：' + src.slice(0, 40)));
    im.src = src;
  });
}

async function boot() {
  const stage = $('#stage');
  for (let i = 0; i < IMG_DEFS.length; i++) {
    const el = await loadImage(IMG_DEFS[i].src);
    const c = document.createElement('canvas');
    c.width = el.naturalWidth; c.height = el.naturalHeight;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(el, 0, 0);
    rt.imgs.push({ el, w: el.naturalWidth, h: el.naturalHeight, ctx });
    rt.view.push({ scale: 1, tx: 0, ty: 0 });
  }
  load();
  // 数据里的框来自旧图尺寸时给出提示（一般不会发生）
  fitView(state.cur.img);
  renderAll();
  requestAnimationFrame(() => { fitView(state.cur.img); renderAll(); });
}
boot().catch(err => {
  console.error(err);
  $('#stage').innerHTML = '<div style="padding:24px;color:#d64545;font:13px/1.7 ui-monospace">图片加载失败：' + err.message + '</div>';
});

/* ============================================================
   视图（缩放/平移）
   ============================================================ */
const stage = $('#stage');
const cv = $('#cv');
const ctx = cv.getContext('2d');

function fitView(imgIdx) {
  const im = rt.imgs[imgIdx], v = rt.view[imgIdx];
  if (!im || !v) return;
  const cw = stage.clientWidth, ch = stage.clientHeight;
  const s = Math.min((cw - 56) / im.w, (ch - 56) / im.h);
  v.scale = s;
  v.tx = (cw - im.w * s) / 2;
  v.ty = (ch - im.h * s) / 2;
}

function fitScale(imgIdx) {
  const im = rt.imgs[imgIdx];
  const cw = stage.clientWidth, ch = stage.clientHeight;
  return Math.min((cw - 56) / im.w, (ch - 56) / im.h);
}

function clampPan() {
  const im = rt.imgs[state.cur.img], v = rt.view[state.cur.img];
  if (!im) return;
  const cw = stage.clientWidth, ch = stage.clientHeight;
  const w = im.w * v.scale, h = im.h * v.scale;
  if (w <= cw) v.tx = (cw - w) / 2; else v.tx = clamp(v.tx, cw - w, 0);
  if (h <= ch) v.ty = (ch - h) / 2; else v.ty = clamp(v.ty, ch - h, 0);
}

function zoomAt(cx, cy, factor) {
  const imgIdx = state.cur.img, v = rt.view[imgIdx];
  const fs = fitScale(imgIdx);
  const ns = clamp(v.scale * factor, Math.min(fs * 0.6, fs), 12);
  if (ns === v.scale) return;
  v.tx = cx - (cx - v.tx) * (ns / v.scale);
  v.ty = cy - (cy - v.ty) * (ns / v.scale);
  v.scale = ns;
  clampPan();
  draw(); updateZoomLabel();
}

function updateZoomLabel() {
  const v = rt.view[state.cur.img], fs = fitScale(state.cur.img);
  if (!v || !fs) return;
  $('#zLv').textContent = Math.round(v.scale / fs * 100) + '%';
}

/* ============================================================
   坐标转换
   ============================================================ */
function toImg(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  const v = rt.view[state.cur.img];
  return {
    x: (clientX - r.left - v.tx) / v.scale,
    y: (clientY - r.top - v.ty) / v.scale,
  };
}

/* ============================================================
   绘制
   ============================================================ */
function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }

function draw() {
  const imgIdx = state.cur.img;
  const im = rt.imgs[imgIdx], v = rt.view[imgIdx];
  if (!im || !v) return;
  const od = dpr();
  const cw = stage.clientWidth, ch = stage.clientHeight;
  if (cv.width !== Math.round(cw * od) || cv.height !== Math.round(ch * od)) {
    cv.width = Math.round(cw * od); cv.height = Math.round(ch * od);
  }
  const g = ctx;

  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#e9ecf1';
  g.fillRect(0, 0, cv.width, cv.height);

  // 图片
  g.save();
  g.setTransform(od * v.scale, 0, 0, od * v.scale, od * v.tx, od * v.ty);
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  g.drawImage(im.el, 0, 0, im.w, im.h);
  g.restore();

  // 屏幕空间画框
  g.setTransform(od, 0, 0, od, 0, 0);
  const S = (p) => ({ x: p.x * v.scale + v.tx, y: p.y * v.scale + v.ty });

  // 其他颜色的框（淡色）
  if (state.showOthers) {
    state.colors.forEach((c, ci) => {
      if (ci === state.cur.color) return;
      c.images[imgIdx].boxes.forEach((b) => {
        const a = S(b), b2 = S({ x: b.x + b.w, y: b.y + b.h });
        g.strokeStyle = 'rgba(64,86,118,.55)';
        g.lineWidth = 1.2;
        g.setLineDash([3, 2.5]);
        g.strokeRect(a.x + .5, a.y + .5, Math.max(1, b2.x - a.x), Math.max(1, b2.y - a.y));
        g.setLineDash([]);
        // 放大后给非当前颜色的框标出颜色编号
        const sw = Math.abs(b2.x - a.x), sh = Math.abs(b2.y - a.y);
        if (sw > 34 && sh > 24) {
          const num = String(ci + 1);
          g.font = '600 9.5px ' + getComputedStyle(document.body).fontFamily;
          const tw2 = g.measureText(num).width + 7;
          g.fillStyle = 'rgba(255,255,255,.92)';
          roundRect(g, a.x + 2, a.y + 2, tw2, 13, 3);
          g.fill();
          g.fillStyle = '#40566f';
          g.textBaseline = 'middle';
          g.fillText(num, a.x + 5.5, a.y + 8.8);
        }
      });
    });
  }

  const curt = curColor();
  const boxes = (curt && curt.images[imgIdx].boxes) || [];
  const active = rt.drag && (rt.drag.mode === 'move' || rt.drag.mode === 'resize') ? rt.drag.i : -1;

  boxes.forEach((b, i) => {
    const a = S(b), b2 = S({ x: b.x + b.w, y: b.y + b.h });
    const x = Math.min(a.x, b2.x), y = Math.min(a.y, b2.y);
    const w = Math.abs(b2.x - a.x), h = Math.abs(b2.y - a.y);
    const isAct = i === active || rt.hover === i;

    // 只在悬停/拖拽时加淡填充，避免影响对框内颜色的判断
    if (isAct) {
      g.fillStyle = 'rgba(47,107,255,.10)';
      g.fillRect(x, y, w, h);
    }
    g.strokeStyle = i === 0 ? '#2f6bff' : '#8e44d9';
    g.lineWidth = isAct ? 2.4 : 2;
    g.strokeRect(x + .5, y + .5, Math.max(1, w), Math.max(1, h));

    // 角标
    const tag = (i === 0 ? '①' : '②');
    g.font = '600 11px ' + getComputedStyle(document.body).fontFamily;
    const tw = g.measureText(tag).width + 8;
    let lx = x - tw - 4, ly = y - 4;
    if (lx < 2) { lx = x + 3; ly = y + 14; }
    g.fillStyle = i === 0 ? '#2f6bff' : '#8e44d9';
    roundRect(g, lx, ly - 12, tw, 16, 4);
    g.fill();
    g.fillStyle = '#fff';
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.fillText(tag, lx + 4, ly - 3.5);
  });

  // 正在绘制的草稿框
  if (rt.draft) {
    const a = S({ x: rt.draft.x, y: rt.draft.y });
    const b2 = S({ x: rt.draft.x + rt.draft.w, y: rt.draft.y + rt.draft.h });
    const x = Math.min(a.x, b2.x), y = Math.min(a.y, b2.y);
    const w = Math.abs(b2.x - a.x), h = Math.abs(b2.y - a.y);
    g.fillStyle = 'rgba(47,107,255,.12)';
    g.fillRect(x, y, w, h);
    g.strokeStyle = '#2f6bff';
    g.lineWidth = 2;
    g.setLineDash([5, 4]);
    g.strokeRect(x + .5, y + .5, Math.max(1, w), Math.max(1, h));
    g.setLineDash([]);
    // 尺寸提示
    const im2 = rt.imgs[imgIdx];
    const rc = normRect(rt.draft, im2);
    const lab = rc.w + ' × ' + rc.h;
    g.font = '500 11px ui-monospace, Menlo, monospace';
    const tw = g.measureText(lab).width + 10;
    let lx = x + w + 6, ly = y + h + 4;
    if (lx + tw > stage.clientWidth - 4) lx = x - tw - 6;
    g.fillStyle = 'rgba(23,27,33,.86)';
    roundRect(g, lx, ly, tw, 17, 4); g.fill();
    g.fillStyle = '#fff';
    g.textBaseline = 'middle';
    g.fillText(lab, lx + 5, ly + 9);
  }

  drawHandles();
}

function drawHandles() {
  const imgIdx = state.cur.img, v = rt.view[imgIdx];
  const curt = curColor();
  if (!curt) return;
  const boxes = curt.images[imgIdx].boxes;
  const g = ctx;
  g.setTransform(dpr(), 0, 0, dpr(), 0, 0);
  boxes.forEach((b, i) => {
    if (rt.hover !== i && !(rt.drag && (rt.drag.mode === 'move' || rt.drag.mode === 'resize') && rt.drag.i === i)) return;
    const x = b.x * v.scale + v.tx, y = b.y * v.scale + v.ty;
    const w = b.w * v.scale, h = b.h * v.scale;
    const pts = [[x, y], [x + w, y], [x, y + h], [x + w, y + h]];
    g.fillStyle = '#fff';
    g.strokeStyle = i === 0 ? '#2f6bff' : '#8e44d9';
    g.lineWidth = 1.5;
    pts.forEach(p => {
      g.beginPath();
      g.rect(p[0] - 3.5, p[1] - 3.5, 7, 7);
      g.fill(); g.stroke();
    });
  });
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ============================================================
   当前颜色
   ============================================================ */
function curColor() {
  return state.colors[state.cur.color] || null;
}

function firstIncomplete(imgIdx, from) {
  const s = typeof from === 'number' ? from : 0;
  for (let i = s; i < state.colors.length; i++) {
    if (state.colors[i].images[imgIdx].boxes.length < BOX_MAX) return i;
  }
  return -1;
}

function trailingEmpty(c) {
  return c.images.every(im => im.boxes.length === 0);
}

function pruneTrailing() {
  while (state.colors.length > 1 && trailingEmpty(state.colors[state.colors.length - 1])) {
    state.colors.pop();
  }
}

/* ============================================================
   渲染
   ============================================================ */
function renderTabs() {
  const tabs = $('#tabs');
  tabs.innerHTML = '';
  IMG_DEFS.forEach((d, i) => {
    const done = state.colors.filter(c => c.images[i].boxes.length === BOX_MAX).length;
    const total = state.colors.length;
    const full = total > 0 && done >= total;
    const b = document.createElement('button');
    b.className = 'tab' + (i === state.cur.img ? ' on' : '');
    b.innerHTML = '图片' + (i + 1) + ' · ' + d.temp +
      '<span class="prog' + (full ? ' full' : '') + '">' + done + '/' + total + '</span>';
    b.onclick = () => setImage(i);
    tabs.appendChild(b);
  });
}

function renderCurCard() {
  const imgIdx = state.cur.img;
  const c = curColor();
  const box = $('#curCard');
  if (!c) { box.innerHTML = ''; return; }
  const idx = state.cur.color;
  const boxes = c.images[imgIdx].boxes;
  const mean = colorMean(imgIdx, c);
  const other = colorMean(1 - imgIdx, c);
  const im = rt.imgs[imgIdx];
  const m = (im && im.w) ? Math.max(im.w, im.h) : 1708;

  $('#curAside').textContent = '第 ' + (boxes.length) + ' / ' + BOX_MAX + ' 个框';

  let html = '<div class="curcard">';
  html += '<div class="top">'
        + '<span class="badge">颜色 ' + (idx + 1) + '</span>'
        + chipEl(mean && mean.rgb, 'big')
        + '<span style="font-size:12px;color:var(--ink3)">图片' + (imgIdx + 1) + ' · ' + IMG_DEFS[imgIdx].temp + '</span>'
        + '</div>';

  html += '<div class="slots">';
  for (let i = 0; i < BOX_MAX; i++) {
    const b = boxes[i];
    if (b && b.px) {
      const P = 2 * (b.w + b.h);
      html += '<div class="slot filled" data-slot="' + i + '">'
        + '<div class="l1">'
        +   '<span class="idx">' + (i === 0 ? '①' : '②') + '</span>'
        +   chipEl(b.rgb)
        +   '<span class="txt"><b class="mono" data-coord="' + i + '">' + b.x + ', ' + b.y + ' · ' + b.w + '×' + b.h + '</b></span>'
        +   '<span class="acts">'
        +     '<button class="btn sm ghost" data-act="redraw" data-i="' + i + '" title="重新框选">重画</button>'
        +     '<button class="btn sm ghost" data-act="delbox" data-i="' + i + '" title="删除">✕</button>'
        +   '</span>'
        + '</div>'
        + '<div class="sub"><span class="mono" data-rgb="' + i + '">' + rgbStr(b.rgb) + '</span>'
        +   '<span class="mono" style="color:#a6aeb9">' + hex(b.rgb) + '</span>'
        +   '<span class="mono" style="margin-left:auto;color:#a6aeb9">' + b.px.toLocaleString() + ' px</span></div>'
        + '</div>';
    } else {
      html += '<div class="slot" data-slot="' + i + '">'
        + '<div class="l1"><span class="idx">' + (i === 0 ? '①' : '②') + '</span>'
        +   '<span class="txt empty">在图上拖拽框选第 ' + (i === 0 ? '一' : '二') + ' 个框</span></div>'
        + '</div>';
    }
  }
  html += '</div>';

  if (mean) {
    html += '<div class="mean">'
      + chipEl(mean.rgb, 'big')
      + '<div style="flex:1"><div class="lbl">' + (boxes.length >= 2 ? '两框合并均值' : '单框均值（还差 1 个框）') + '</div>'
      + '<div class="val">' + mean.rgb.map(r1).join(', ') + '</div>'
      + '<div class="hex">' + hex(mean.rgb) + ' · ' + mean.px.toLocaleString() + ' 像素</div></div>'
      + '</div>';
  }

  if (other) {
    html += '<div class="pair">'
      + '<span>对应 图片' + (2 - imgIdx) + ' 颜色 ' + (idx + 1) + '</span>'
      + chipEl(other.rgb)
      + '<span class="mono">' + hex(other.rgb) + '</span>'
      + '<button class="btn sm ghost" data-act="peek" style="margin-left:auto;padding:1px 6px">对照</button>'
      + '</div>';
  }
  html += '</div>';

  box.innerHTML = html;

  box.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const act = btn.dataset.act;
      const i = +btn.dataset.i;
      if (act === 'redraw') redrawBox(i);
      else if (act === 'delbox') delBox(i);
      else if (act === 'peek') peekOther();
    };
  });
}

function chipEl(rgb, cls, title) {
  const t = title ? ' title="' + title + '"' : '';
  if (!rgb) return '<span class="chip ' + (cls || '') + ' empty"' + t + '></span>';
  return '<span class="chip ' + (cls || '') + '" style="background-color:' + hex(rgb) + '"' + t + '></span>';
}

function renderList() {
  const imgIdx = state.cur.img;
  const list = $('#list');
  let html = '';
  state.colors.forEach((c, i) => {
    const n0 = c.images[0].boxes.length, n1 = c.images[1].boxes.length;
    const m0 = colorMean(0, c), m1 = colorMean(1, c);
    const cur = imgIdx === 0 ? n0 : n1;
    const full = n0 === BOX_MAX && n1 === BOX_MAX;
    html += '<div class="item' + (i === state.cur.color ? ' on' : '') + '" data-i="' + i + '">'
      + '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>'
      + '<span class="chips">'
      +   chipEl(m0 && m0.rgb, '', '图片1 · ' + (m0 ? hex(m0.rgb) : '未标注'))
      +   chipEl(m1 && m1.rgb, '', '图片2 · ' + (m1 ? hex(m1.rgb) : '未标注'))
      + '</span>'
      + '<span class="state">'
      +   '<span class="dots">'
      +     '<i class="' + (n0 ? 'f' : '') + '"></i><i class="' + (n0 > 1 ? 'f' : '') + '"></i>'
      +     '<i style="width:7px;background:transparent"></i>'
      +     '<i class="' + (n1 ? 'f' : '') + '"></i><i class="' + (n1 > 1 ? 'f' : '') + '"></i>'
      +   '</span>'
      +   '<span style="color:' + (cur === BOX_MAX ? '#0d9b6c' : '#8b95a3') + '">' + cur + '/' + BOX_MAX + '</span>'
      + '</span>'
      + '<button class="del" data-del="' + i + '" title="删除该颜色">✕</button>'
      + '</div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('.item').forEach(it => {
    it.onclick = (e) => {
      if (e.target.dataset.del !== undefined) return;
      selectColor(+it.dataset.i, true);
    };
  });
  list.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      delColor(+b.dataset.del);
    };
  });

  const doneCur = state.colors.filter(c => c.images[imgIdx].boxes.length === BOX_MAX).length;
  $('#listMeta').textContent = '本图 ' + doneCur + '/' + state.colors.length;
}

function renderHeader() {
  const c = curColor();
  const imgIdx = state.cur.img;
  $('#pTitle').textContent = '颜色 ' + (state.cur.color + 1) + ' / ' + state.colors.length;
  $('#brandSub').textContent = IMG_DEFS[imgIdx].temp;
  let sub = c ? ('图片' + (imgIdx + 1) + ' · ' + (BOX_MAX - c.images[imgIdx].boxes.length > 0
    ? '还需 ' + (BOX_MAX - c.images[imgIdx].boxes.length) + ' 个框'
    : '该色 2/2 已标满，可拖动微调')) : '';
  if (state.pinned) sub = '编辑中 · 自动推进已暂停';
  $('#pSub').textContent = sub;
  $('#btnGoNext').style.display = state.pinned ? '' : 'none';

  // 槽位高亮：下一个待填的框
  const n = c ? c.images[imgIdx].boxes.length : 0;
  document.querySelectorAll('#curCard .slot').forEach((s, i) => {
    s.classList.toggle('active', !state.pinned && i === n && n < BOX_MAX);
  });
}

function renderAll() {
  renderTabs();
  renderCurCard();
  renderList();
  renderHeader();
  draw();
  updateZoomLabel();
}

/* 只在拖拽过程中刷新数值，避免整列表重排 */
function refreshLive() {
  const c = curColor();
  if (!c) return;
  const boxes = c.images[state.cur.img].boxes;
  boxes.forEach((b, i) => {
    const ce = document.querySelector('[data-coord="' + i + '"]');
    if (ce) ce.textContent = b.x + ', ' + b.y + ' · ' + b.w + '×' + b.h;
    const re = document.querySelector('[data-rgb="' + i + '"]');
    if (re) re.textContent = rgbStr(b.rgb);
  });
}

/* ============================================================
   交互：框选 / 移动 / 缩放
   ============================================================ */
function hitBox(p, box, tol) {
  const x0 = Math.min(box.x, box.x + box.w), x1 = Math.max(box.x, box.x + box.w);
  const y0 = Math.min(box.y, box.y + box.h), y1 = Math.max(box.y, box.y + box.h);
  return p.x >= x0 - tol && p.x <= x1 + tol && p.y >= y0 - tol && p.y <= y1 + tol;
}

function hitHandle(p, box, tol) {
  const pts = {
    nw: { x: box.x, y: box.y },
    ne: { x: box.x + box.w, y: box.y },
    sw: { x: box.x, y: box.y + box.h },
    se: { x: box.x + box.w, y: box.y + box.h },
  };
  for (const k in pts) {
    if (Math.abs(p.x - pts[k].x) <= tol && Math.abs(p.y - pts[k].y) <= tol) return k;
  }
  return null;
}

cv.addEventListener('contextmenu', e => e.preventDefault());

cv.addEventListener('pointerdown', (e) => {
  if (!rt.imgs.length) return;
  const imgIdx = state.cur.img, v = rt.view[imgIdx], im = rt.imgs[imgIdx];
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;

  // 平移
  if (e.button === 1 || (e.button === 0 && rt.spaceDown)) {
    rt.drag = { mode: 'pan', sx, sy, tx: v.tx, ty: v.ty };
    cv.setPointerCapture(e.pointerId);
    cv.style.cursor = 'grabbing';
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;

  const c = curColor();
  if (!c) return;
  const p = toImg(e.clientX, e.clientY);
  if (p.x < 0 || p.y < 0 || p.x > im.w || p.y > im.h) return;

  const boxes = c.images[imgIdx].boxes;
  const tol = 8 / v.scale;

  // 角点缩放
  for (let i = boxes.length - 1; i >= 0; i--) {
    const h = hitHandle(p, boxes[i], tol * 1.6);
    if (h) {
      pushUndo();
      rt.drag = { mode: 'resize', i, h, orig: { x: boxes[i].x, y: boxes[i].y, w: boxes[i].w, h: boxes[i].h } };
      cv.setPointerCapture(e.pointerId);
      return;
    }
  }
  // 移动
  for (let i = boxes.length - 1; i >= 0; i--) {
    if (hitBox(p, boxes[i], tol * 0.6)) {
      pushUndo();
      rt.drag = { mode: 'move', i, orig: { x: boxes[i].x, y: boxes[i].y }, px: p.x, py: p.y };
      cv.setPointerCapture(e.pointerId);
      cv.style.cursor = 'move';
      return;
    }
  }
  // 新建
  if (boxes.length >= BOX_MAX) {
    toast('该颜色已标满 ' + BOX_MAX + ' 个框 · 可拖动/缩放调整，或点『重画』');
    return;
  }
  rt.drag = { mode: 'new', x: p.x, y: p.y };
  rt.draft = { x: p.x, y: p.y, w: 0, h: 0 };
  cv.setPointerCapture(e.pointerId);
});

cv.addEventListener('pointermove', (e) => {
  if (!rt.imgs.length) return;
  const imgIdx = state.cur.img, v = rt.view[imgIdx], im = rt.imgs[imgIdx];
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  rt.lastPointer = { x: sx, y: sy };

  if (!rt.drag) {
    // hover 检测
    const p = toImg(e.clientX, e.clientY);
    const c = curColor();
    let hv = null, cur = 'crosshair';
    if (c && p.x >= 0 && p.y >= 0 && p.x <= im.w && p.y <= im.h) {
      const boxes = c.images[imgIdx].boxes, tol = 8 / v.scale;
      for (let i = boxes.length - 1; i >= 0; i--) {
        const h = hitHandle(p, boxes[i], tol * 1.6);
        if (h) {
          hv = i;
          cur = (h === 'nw' || h === 'se') ? 'nwse-resize' : 'nesw-resize';
          break;
        }
      }
      if (hv === null) {
        for (let i = boxes.length - 1; i >= 0; i--) {
          if (hitBox(p, boxes[i], tol * 0.6)) { hv = i; cur = 'move'; break; }
        }
      }
    }
    if (hv !== rt.hover) { rt.hover = hv; draw(); }
    if (!rt.spaceDown) cv.style.cursor = cur;
    return;
  }

  if (rt.drag.mode === 'pan') {
    v.tx = rt.drag.tx + (sx - rt.drag.sx);
    v.ty = rt.drag.ty + (sy - rt.drag.sy);
    clampPan();
    draw();
    return;
  }

  const p = toImg(e.clientX, e.clientY);
  const c = curColor();
  if (!c) return;
  const boxes = c.images[imgIdx].boxes;

  if (rt.drag.mode === 'new') {
    rt.draft = {
      x: clamp(Math.min(rt.drag.x, p.x), 0, im.w),
      y: clamp(Math.min(rt.drag.y, p.y), 0, im.h),
      w: Math.min(Math.abs(p.x - rt.drag.x), im.w),
      h: Math.min(Math.abs(p.y - rt.drag.y), im.h),
    };
    // 保证不越界
    if (rt.draft.x + rt.draft.w > im.w) rt.draft.w = im.w - rt.draft.x;
    if (rt.draft.y + rt.draft.h > im.h) rt.draft.h = im.h - rt.draft.y;
    draw();
    return;
  }

  if (rt.drag.mode === 'move') {
    const b = boxes[rt.drag.i];
    if (!b) return;
    b.x = clamp(rt.drag.orig.x + (p.x - rt.drag.px), 0, im.w - b.w);
    b.y = clamp(rt.drag.orig.y + (p.y - rt.drag.py), 0, im.h - b.h);
    recomputeBox(imgIdx, b);
    draw(); refreshLive();
    return;
  }

  if (rt.drag.mode === 'resize') {
    const b = boxes[rt.drag.i], o = rt.drag.orig, h = rt.drag.h;
    let x = o.x, y = o.y, w = o.w, hh = o.h;
    const px = clamp(p.x, 0, im.w), py = clamp(p.y, 0, im.h);
    if (h === 'nw') { x = px; y = py; w = o.x + o.w - px; hh = o.y + o.h - py; }
    if (h === 'ne') { y = py; w = px - o.x; hh = o.y + o.h - py; }
    if (h === 'sw') { x = px; w = o.x + o.w - px; hh = py - o.y; }
    if (h === 'se') { w = px - o.x; hh = py - o.y; }
    if (w < 0) { x += w; w = -w; }
    if (hh < 0) { y += hh; hh = -hh; }
    b.x = clamp(x, 0, im.w); b.y = clamp(y, 0, im.h);
    b.w = clamp(w, 1, im.w - b.x); b.h = clamp(hh, 1, im.h - b.y);
    recomputeBox(imgIdx, b);
    draw(); refreshLive();
    return;
  }
});

cv.addEventListener('pointerup', (e) => {
  const d = rt.drag;
  rt.drag = null;
  rt.hover = null;
  cv.style.cursor = rt.spaceDown ? 'grab' : 'crosshair';
  if (!d) return;

  if (d.mode === 'pan') { draw(); return; }

  const imgIdx = state.cur.img, im = rt.imgs[imgIdx];
  const c = curColor();
  if (!c) { rt.draft = null; draw(); return; }
  const boxes = c.images[imgIdx].boxes;

  if (d.mode === 'new') {
    const dr = rt.draft;
    rt.draft = null;
    if (dr && dr.w >= MIN_BOX && dr.h >= MIN_BOX) {
      pushUndo();
      const b = { x: dr.x, y: dr.y, w: dr.w, h: dr.h };
      recomputeBox(imgIdx, b);
      c.images[imgIdx].boxes.push(b);
      const n = c.images[imgIdx].boxes.length;
      toast('已记录第 ' + n + ' 个框 · ' + hex(b.rgb));
      afterBoxAdded(imgIdx);
    } else {
      draw();
    }
    return;
  }

  // 移动 / 缩放收尾：取整并重算
  if (d.mode === 'move' || d.mode === 'resize') {
    const b = boxes[d.i];
    if (b) recomputeBox(imgIdx, b);
    renderAll(); save();
  }
});

cv.addEventListener('pointercancel', () => { rt.drag = null; rt.draft = null; draw(); });

/* 完成一个框之后的推进逻辑 */
function afterBoxAdded(imgIdx) {
  const c = curColor();
  const n = c.images[imgIdx].boxes.length;
  renderAll(); save();

  if (n < BOX_MAX) return;
  if (!state.autoAdvance || state.pinned) return;

  const next = firstIncomplete(imgIdx, state.cur.color + 1);
  if (next >= 0) {
    const doneNum = state.cur.color + 1;
    state.cur.color = next;
    renderAll(); save();
    toast('颜色 ' + doneNum + ' 完成 → 跳到颜色 ' + (next + 1));
    return;
  }
  if (imgIdx === 0) {
    // 图片1 还有更多颜色：自动新建
    pushUndo();
    state.colors.push(newColor());
    state.cur.color = state.colors.length - 1;
    renderAll(); save();
    toast('已新建颜色 ' + state.colors.length + '（图片1 标完请切到图片2）', 2400);
  } else {
    toast('图片2 全部颜色已标注完成 🎉', 2400);
    renderAll();
  }
}

/* ============================================================
   操作
   ============================================================ */
function setImage(i) {
  if (i === state.cur.img) return;
  pushUndo();
  const prevColor = state.cur.color;
  pruneTrailing();
  state.cur.img = i;
  state.pinned = false;
  const st = rt.imgs[i] ? null : null;
  fitView(i);
  const ni = firstIncomplete(i, 0);
  state.cur.color = (ni >= 0) ? ni : clamp(prevColor, 0, state.colors.length - 1);
  renderAll(); save();

  const total = state.colors.length;
  const done = state.colors.filter(c => c.images[i].boxes.length === BOX_MAX).length;
  if (done === total && total > 0) toast('图片' + (i + 1) + ' 已全部完成（' + total + ' 色）');
  else toast('切换到图片' + (i + 1) + ' · ' + IMG_DEFS[i].temp + ' · 从颜色 ' + (state.cur.color + 1) + ' 继续');
}

function selectColor(i, pin) {
  if (i < 0 || i >= state.colors.length) return;
  state.cur.color = i;
  if (pin) state.pinned = true;
  renderAll(); save();
}

function addColor() {
  pushUndo();
  state.colors.push(newColor());
  state.cur.color = state.colors.length - 1;
  state.pinned = true;
  renderAll(); save();
  toast('已新增颜色 ' + state.colors.length);
}

function delColor(i) {
  if (state.colors.length <= 1) { toast('至少保留一个颜色'); return; }
  const c = state.colors[i];
  const hasData = c.images.some(im => im.boxes.length);
  if (hasData && !confirm('颜色 ' + (i + 1) + ' 已有标注数据，确定删除？')) return;
  pushUndo();
  state.colors.splice(i, 1);
  if (state.cur.color >= state.colors.length) state.cur.color = state.colors.length - 1;
  if (state.cur.color > i) state.cur.color--;
  renderAll(); save();
  toast('已删除颜色 ' + (i + 1) + '（颜色编号已顺延）');
}

function redrawBox(i) {
  const c = curColor();
  if (!c) return;
  pushUndo();
  c.images[state.cur.img].boxes.splice(i, 1);
  renderAll(); save();
  toast('已清除第 ' + (i + 1) + ' 个框，请重新框选');
}

function delBox(i) {
  const c = curColor();
  if (!c) return;
  pushUndo();
  c.images[state.cur.img].boxes.splice(i, 1);
  renderAll(); save();
  toast('已删除第 ' + (i + 1) + ' 个框');
}

function peekOther() {
  const c = curColor();
  if (!c) return;
  const otherIdx = 1 - state.cur.img;
  if (!c.images[otherIdx].boxes.length) { toast('对应图片还没有标注'); return; }
  // 临时跳到另一张图查看同一颜色，再切回
  const back = state.cur.img;
  state.cur.img = otherIdx;
  state.pinned = true;
  fitView(otherIdx);
  renderAll();
  toast('对照：图片' + (otherIdx + 1) + ' 颜色 ' + (state.cur.color + 1) + ' · 再次点击可切回', 2200);
  const tabsEl = $('#tabs');
  // 提示返回：临时按钮
  if (!document.getElementById('backBtn')) {
    const b = document.createElement('button');
    b.id = 'backBtn';
    b.className = 'btn sm';
    b.textContent = '返回图片' + (back + 1);
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;box-shadow:0 4px 14px rgba(20,30,50,.16)';
    b.onclick = () => { b.remove(); state.cur.img = back; fitView(back); renderAll(); };
    document.body.appendChild(b);
    setTimeout(() => { if (b.parentNode) b.remove(); }, 15000);
  }
}

function goNextAuto() {
  state.pinned = false;
  let ni = firstIncomplete(state.cur.img, 0);
  if (ni < 0) {
    if (state.cur.img === 0) {
      pushUndo();
      state.colors.push(newColor());
      ni = state.colors.length - 1;
    } else {
      ni = state.cur.color;
      toast('本图所有颜色已标满');
    }
  }
  state.cur.color = ni;
  renderAll(); save();
  toast('从颜色 ' + (ni + 1) + ' 继续自动标注');
}

function stepColor(d) {
  const n = state.colors.length;
  let i = state.cur.color + d;
  if (i < 0) i = 0;
  if (i > n - 1) {
    if (state.cur.img === 0 && d > 0) { pushUndo(); state.colors.push(newColor()); i = state.colors.length - 1; }
    else i = n - 1;
  }
  selectColor(i, true);
}

/* ============================================================
   导出 / 导入
   ============================================================ */
function timestamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
}

function buildExport() {
  const colors = state.colors
    .map((c, i) => ({ c, i }))
    .filter(o => o.c.images.some(im => im.boxes.length))
    .map(o => {
      const perImage = o.c.images.map((im, k) => {
        const mean = colorMean(k, o.c);
        return {
          slot: k + 1,
          file: IMG_DEFS[k].file,
          temp: IMG_DEFS[k].tag,
          boxes: im.boxes.map(b => ({
            x: b.x, y: b.y, w: b.w, h: b.h,
            meanRgb: { r: r1(b.rgb[0]), g: r1(b.rgb[1]), b: r1(b.rgb[2]) },
            pixels: b.px,
          })),
          meanRgb: mean ? { r: r1(mean.rgb[0]), g: r1(mean.rgb[1]), b: r1(mean.rgb[2]) } : null,
          hex: mean ? hex(mean.rgb) : null,
          pixels: mean ? mean.px : 0,
        };
      });
      return { id: o.c.id, index: o.i + 1, perImage };
    });

  return {
    app: '烧制色盘标注',
    version: 1,
    exportedAt: new Date().toISOString(),
    coordinateSpace: '原图像素坐标，左上角为原点，x 向右、y 向下',
    boxRule: '每个颜色每张图固定 2 个框；meanRgb 为该图两个框内全部像素的 RGB 平均值',
    images: IMG_DEFS.map((d, k) => ({
      slot: k + 1, file: d.file, temp: d.tag, tempLabel: d.temp,
      width: rt.imgs[k] ? rt.imgs[k].w : null,
      height: rt.imgs[k] ? rt.imgs[k].h : null,
    })),
    colors,
  };
}

function download(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportJSON() {
  const data = buildExport();
  if (!data.colors.length) { toast('还没有任何标注数据'); return; }
  download('色盘标注_' + timestamp() + '.json', JSON.stringify(data, null, 2));
  toast('已导出 ' + data.colors.length + ' 个颜色');
}

function csvCell(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }

function exportCSV() {
  const data = buildExport();
  if (!data.colors.length) { toast('还没有任何标注数据'); return; }
  const head = ['color_index', 'image_slot', 'image_file', 'temp',
    'box1_x', 'box1_y', 'box1_w', 'box1_h', 'box1_px',
    'box2_x', 'box2_y', 'box2_w', 'box2_h', 'box2_px',
    'mean_r', 'mean_g', 'mean_b', 'hex', 'pixels', 'complete'];
  const rows = [head.join(',')];
  data.colors.forEach(c => {
    c.perImage.forEach(pi => {
      const b1 = pi.boxes[0] || {}, b2 = pi.boxes[1] || {};
      rows.push([
        c.index, pi.slot, pi.file, pi.temp,
        b1.x ?? '', b1.y ?? '', b1.w ?? '', b1.h ?? '', b1.pixels ?? '',
        b2.x ?? '', b2.y ?? '', b2.w ?? '', b2.h ?? '', b2.pixels ?? '',
        pi.meanRgb ? pi.meanRgb.r : '', pi.meanRgb ? pi.meanRgb.g : '', pi.meanRgb ? pi.meanRgb.b : '',
        pi.hex || '', pi.pixels, pi.boxes.length === BOX_MAX ? 1 : 0,
      ].join(','));
    });
  });
  download('色盘标注_' + timestamp() + '.csv', '\ufeff' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  toast('已导出 CSV（' + (rows.length - 1) + ' 行）');
}

function importJSON(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { toast('JSON 解析失败'); return false; }
  const s = blankState();
  s.colors = [];
  try {
    if (Array.isArray(d.colors) && d.colors[0] && d.colors[0].perImage) {
      // 导出的格式
      d.colors
        .slice()
        .sort((a, b) => (a.index || 0) - (b.index || 0))
        .forEach(c => {
          const nc = newColor();
          nc.id = c.id || nc.id;
          c.perImage.forEach((pi, k) => {
            if (k > 1) return;
            (pi.boxes || []).forEach(b => {
              const nb = { x: b.x | 0, y: b.y | 0, w: b.w | 0, h: b.h | 0 };
              recomputeBox(k, nb);
              nc.images[k].boxes.push(nb);
            });
          });
          s.colors.push(nc);
        });
    } else if (Array.isArray(d.colors) && d.colors[0] && d.colors[0].images) {
      // 内部格式
      d.colors.forEach(c => {
        const nc = newColor();
        nc.id = c.id || nc.id;
        c.images.forEach((im, k) => {
          if (k > 1) return;
          (im.boxes || []).forEach(b => {
            const nb = { x: b.x | 0, y: b.y | 0, w: b.w | 0, h: b.h | 0 };
            recomputeBox(k, nb);
            nc.images[k].boxes.push(nb);
          });
        });
        s.colors.push(nc);
      });
    } else {
      toast('文件格式不认识'); return false;
    }
  } catch (e) { toast('导入失败：' + e.message); return false; }

  if (!s.colors.length) { toast('文件里没有颜色数据'); return false; }
  s.cur = { img: 0, color: 0 };
  s.autoAdvance = true; s.pinned = false; s.showOthers = true;
  state = s;
  const ni = firstIncomplete(0, 0);
  state.cur.color = ni >= 0 ? ni : 0;
  fitView(0);
  renderAll(); save();
  toast('已导入 ' + s.colors.length + ' 个颜色');
  return true;
}

window.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.code === 'Space') { rt.spaceDown = true; cv.style.cursor = 'grab'; e.preventDefault(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'Backspace' || e.key === 'Delete') {
    const c = curColor();
    if (c && rt.hover !== null && rt.hover !== undefined && c.images[state.cur.img].boxes[rt.hover]) {
      e.preventDefault();
      delBox(rt.hover);
    }
  }
  if (e.key === 'Escape') { rt.drag = null; rt.draft = null; draw(); }
  if (e.key === '1') setImage(0);
  if (e.key === '2') setImage(1);
  if (e.key.toLowerCase() === 'f') { fitView(state.cur.img); draw(); updateZoomLabel(); }
  if (e.key === 'ArrowDown' || e.key === ']') stepColor(1);
  if (e.key === 'ArrowUp' || e.key === '[') stepColor(-1);
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space') { rt.spaceDown = false; cv.style.cursor = 'crosshair'; }
});

let rzTimer = 0;
const ro = new ResizeObserver(() => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => {
    if (!rt.imgs.length) return;
    // 窗口变化时保持当前缩放中心，仅在未手动缩放时重新适应
    draw(); updateZoomLabel();
  }, 60);
});
ro.observe(stage);

window.addEventListener('beforeunload', () => {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
});

/* 暴露给自动化测试使用 */
window.__annotator = {
  get state() { return state; },
  get rt() { return rt; },
  toImg, draw, renderAll, setImage, selectColor, addColor, exportData: buildExport,
  _addBoxForTest(imgIdx, ci, box) {
    const c = state.colors[ci];
    const b = { x: box.x, y: box.y, w: box.w, h: box.h };
    recomputeBox(imgIdx, b);
    c.images[imgIdx].boxes.push(b);
    afterBoxAdded(imgIdx);
    return b;
  },
};

})();
</script>
